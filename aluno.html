<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Responder Quiz | GitWil - Quiz Interativo</title>
    <meta name="description" content="Responda ao quiz interativo em tempo real. Entre com o código da sala e participe.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://gitwil.com.br/aluno.html">

    


    
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-Ck46EvPz.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32-D6VyuQ9w.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16-26Ty9ZxR.png">
    <link rel="manifest" href="./assets/site-BwHFeIBa.webmanifest">

    <style>
        #area-botoes, #area-discursiva { 
            max-width: 500px; margin: 0 auto; width: 100%; 
            display: flex; flex-direction: column; align-items: center; 
        }
        #tela-votacao { display: none; }
        #btn-confirmar { max-width: 500px; margin: 20px auto 0; }
        
        /* Estilo da TextArea Discursiva */
        .input-discursiva {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--accent-color);
            background-color: var(--surface-color);
            color: var(--text-primary);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        .input-discursiva:focus {
            box-shadow: 0 0 15px rgba(13, 131, 253, 0.3);
        }
    </style>
  <link rel="stylesheet" crossorigin href="./assets/main-DrdrLrTM.css">
</head>
<body>

    <div id="tela-conectando" class="full-h text-center">
        <div class="spinner-border text-primary mx-auto mb-3" style="width: 3rem; height: 3rem;"></div>
        <h4 class="text-muted fw-bold">Conectando à sala...</h4>
    </div>

    <div id="tela-votacao" class="full-h">
        
        <div class="text-center mb-5">
            <span class="badge rounded-pill bg-secondary bg-opacity-25 fs-6 px-4 py-2" style="color: var(--text-primary);">
                <i class="bi bi-check-circle-fill text-success me-2 small"></i>
                <span id="contador-global" class="fw-bold">0</span> 
                <span id="texto-contador">respostas</span>
            </span>
        </div>

        <h3 id="titulo-modo" class="text-center mb-5 fw-bolder display-6">Aguardando...</h3>
        
        <div id="area-botoes"></div>

        <div id="area-discursiva" style="display:none;">
            <textarea id="texto-resposta" class="input-discursiva" placeholder="Digite sua resposta aqui..."></textarea>
        </div>

        <button id="btn-confirmar" style="display:none;" onclick="enviarRespostaManual()">
            <div class="btn-content-wrapper">
                <span class="btn-texto">ENVIAR RESPOSTA</span>
                <i class="bi bi-arrow-repeat btn-icon-anim icon-spinner"></i>
                <i class="bi bi-check-circle-fill btn-icon-anim icon-check"></i>
            </div>
        </button>

        <div id="msg-bloqueio" class="text-center mt-5 fade show" style="display: none;">
            <i class="bi bi-check-circle-fill text-success display-1 mb-3 d-block"></i>
            <h2 class="fw-bold">Resposta Enviada!</h2>
            <p class="text-muted fs-5">Aguarde a próxima questão.</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        window.GITWIL_CONFIG = (() => {
            const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const apiUrl = isLocalHost
                ? 'http://localhost:3000'
                : 'https://gitwil-api-production.up.railway.app';

            return {
                apiUrl,
                routes: {
                    home: new URL('./index.html', window.location.href).href,
                    aluno: new URL('./aluno.html', window.location.href).href,
                    professor: new URL('./professor.html', window.location.href).href
                }
            };
        })();

        
        const savedTheme = localStorage.getItem('gitwil-theme');
        const apiUrl = window.GITWIL_CONFIG.apiUrl;
        const routes = window.GITWIL_CONFIG.routes;

        if (savedTheme === 'light') document.body.classList.add('light-mode');
        setTimeout(() => { document.body.classList.add('theme-ready'); }, 100);

        // Gera ou recupera um ID único por browser para controle de votação duplicada.
        // Usa localStorage para que o mesmo ID seja compartilhado entre todas as abas
        // do mesmo browser, impedindo que o aluno vote em múltiplas guias.
        //
        // LIMITAÇÕES CONHECIDAS:
        // 1. O aluno pode burlar limpando o localStorage (Configurações do browser → Limpar dados).
        //    Após limpar, um novo ID é gerado e o aluno pode votar novamente.
        // 2. No Safari em modo privado, localStorage é volátil: é limpo ao fechar a aba,
        //    permitindo que o aluno vote novamente ao reabrir. Mesma fragilidade de cookies.
        // 3. Browsers com política de privacidade restrita podem bloquear localStorage,
        //    causando erro silencioso. Nesse caso o aluno recebe um novo ID a cada visita.
        // 4. Diferentes browsers na mesma máquina (Chrome + Firefox) geram IDs distintos —
        //    isso é intencional, pois representam "dispositivos" diferentes, como no Mentimeter.
        //
        // Para bloqueio definitivo seria necessário login com autenticação de usuário.
        function obterOuCriarIdVotante() {
            const KEY = 'gitwil_voter_id';
            let id = localStorage.getItem(KEY);
            if (!id) {
                id = 'ls_' + ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
                );
                localStorage.setItem(KEY, id);
            }
            return id;
        }

        const alunoId = obterOuCriarIdVotante();

//Agora usando WebSocket real via Railway (não mais long polling!)
        const socket = io(apiUrl, { auth: { alunoId: alunoId } });
        let codigoSala = '';
        let configAtual = {};
        let selecoes = [];
        let jaVotou = false;

        // Fix 1: primeiroConnect ignora o 'connect' inicial.
        // Na primeira carga, o window.onload enfileira entrar_sala antes do socket
        // conectar. Quando o socket conecta, 'connect' dispara e codigoSala já
        // está definido — sem a flag, emitiria entrar_sala uma segunda vez.
        let primeiroConnect = true;
        socket.on('connect', () => {
            if (primeiroConnect) { primeiroConnect = false; return; }
            if (codigoSala) {
                socket.emit('entrar_sala', { codigo: codigoSala });
            }
        });

        //Problema entre o socket.on e window.onload
        /*
            No dia normal, a energia já está ligada quando a loja termina de ser arrumada. 
            Então o Funcionário A abre a porta normalmente. 
            O Funcionário B não faz nada porque a energia nunca caiu.
            Mas em alguns dias (desktop rápido), a loja termina de ser arrumada antes da energia voltar. 
            O Funcionário A tenta abrir a porta, mas está enfileirado esperando a energia. 
            Quando a energia volta, o Funcionário B acorda e também tenta abrir a porta — aí os dois abrem juntos, causando confusão.

        */

        //Analogia Funcionário A -> Abre a porta quando a loja termina de ser arrumada
        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const codigoUrl = params.get('codigo');

            if (codigoUrl) {
                // Entrada normal: código digitado na home page
                codigoSala = codigoUrl;
                socket.emit('entrar_sala', { codigo: codigoUrl });
            } else {
                // Entrada via QR Code estático: busca a sala ativa no servidor
                try {
                    const resp = await fetch(apiUrl + '/api/sala-ativa');
                    const dados = await resp.json();
                    if (dados.codigo) {
                        codigoSala = dados.codigo;
                        socket.emit('entrar_sala', { codigo: dados.codigo });
                    } else {
                        document.getElementById('tela-conectando').innerHTML =
                            '<p class="text-muted fw-bold fs-5">Nenhuma sala ativa no momento.<br>Aguarde o professor abrir uma sessão.</p>';
                    }
                } catch (e) {
                    document.getElementById('tela-conectando').innerHTML =
                        '<p class="text-muted fw-bold fs-5">Erro de conexão com o servidor.</p>';
                }
            }
        };

        socket.on('entrada_ok', () => {
            document.getElementById('tela-conectando').style.display = 'none';
            document.getElementById('tela-votacao').style.display = 'flex';
        });
        // Fix 2: limpa codigoSala antes do alert.
        // O alert() bloqueia o JS — durante esse bloqueio o socket pode perder
        // o heartbeat, desconectar e reconectar. Se codigoSala ainda tiver valor,
        // o 'connect' emitiria entrar_sala de novo gerando um segundo alert.
        socket.on('erro_sala', (msg) => { codigoSala = ''; alert(msg); window.location.href = routes.home; });
        socket.on('erro_voto', (msg) => alert(msg));
        
        socket.on('atualizar_stats_aluno', (d) => {
            const total = d.total;
            document.getElementById('contador-global').innerText = total;
            const label = (total === 1 || total === 0) ? 'resposta' : 'respostas';
            document.getElementById('texto-contador').innerText = label;
        });
        
        socket.on('atualizar_config_aluno', (c) => { configAtual = c; resetarEstado(); });
        socket.on('reset_aluno', resetarEstado);
        socket.on('bloquear_voto', bloquearTela);

        socket.on('sala_encerrada', () => {
            alert('A sala foi encerrada pelo professor.');
            window.location.href = routes.home;
        });

        function resetarEstado() {
            jaVotou = false; selecoes = []; 
            document.getElementById('texto-resposta').value = ''; // Limpa texto
            desbloquearTela(); 
            renderizarInterface();
        }

        function renderizarInterface() {
            const areaBtns = document.getElementById('area-botoes');
            const areaDisc = document.getElementById('area-discursiva');
            const btnConf = document.getElementById('btn-confirmar');
            
            areaBtns.innerHTML = '';
            areaBtns.style.display = 'none';
            areaDisc.style.display = 'none';
            btnConf.style.display = 'none';
            btnConf.className = ''; // Reseta classes de animação

            if(jaVotou) return;

            // --- MODO DISCURSIVA ---
            if (configAtual.tipoPergunta === 'discursiva') {
                document.getElementById('titulo-modo').innerText = 'Digite sua resposta:';
                areaDisc.style.display = 'flex';
                btnConf.style.display = 'block';
            } 
            // --- MODO BOTÕES ---
            else {
                areaBtns.style.display = 'flex';
                let opcoes = (configAtual.tipoPergunta === 'certo_errado') ? ['Certo', 'Errado'] : ['A', 'B', 'C', 'D', 'E', 'Não sei'].slice(0, parseInt(configAtual.qtdOpcoes));
                
                document.getElementById('titulo-modo').innerText = configAtual.modoSelecao === 'multipla' ? 'Marque as opções corretas:' : 'Selecione sua resposta:';

                opcoes.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcao';
                    btn.innerHTML = `
                        <div class="btn-content-wrapper">
                            <span class="btn-texto">${opt}</span>
                            <i class="bi bi-arrow-repeat btn-icon-anim icon-spinner"></i>
                            <i class="bi bi-check-circle-fill btn-icon-anim icon-check"></i>
                        </div>
                    `;
                    btn.onclick = () => clicarOpcao(btn, opt);
                    areaBtns.appendChild(btn);
                });

                if (configAtual.modoSelecao === 'multipla') btnConf.style.display = 'block';
            }
        }

        function clicarOpcao(btnElement, valor) {
            if(jaVotou) return;
            if (configAtual.modoSelecao === 'unica' || configAtual.tipoPergunta === 'certo_errado') {
                selecoes = valor;
                animarEnvio(btnElement); // Envia direto
            } else {
                if (selecoes.includes(valor)) {
                    selecoes = selecoes.filter(i => i !== valor);
                    btnElement.classList.remove('selecionado');
                } else {
                    selecoes.push(valor);
                    btnElement.classList.add('selecionado');
                }
            }
        }

        // Função chamada pelo botão "Confirmar"
        function enviarRespostaManual() {
            if (configAtual.tipoPergunta === 'discursiva') {
                const texto = document.getElementById('texto-resposta').value.trim();
                if(!texto) return alert("Digite algo antes de enviar.");
                selecoes = texto; // Salva o texto na variável de envio
            }
            animarEnvio(document.getElementById('btn-confirmar'));
        }

        function animarEnvio(botaoAlvo) {
            // Validações
            if (configAtual.tipoPergunta !== 'discursiva' && configAtual.modoSelecao === 'multipla' && selecoes.length === 0) {
                return alert("Selecione pelo menos uma opção!");
            }
            
            jaVotou = true;
            botaoAlvo.classList.remove('selecionado');
            botaoAlvo.classList.add('enviando');

            // Envia (selecoes pode ser array ou string agora)
            socket.emit('enviar_resposta', { codigo: codigoSala, respostas: selecoes });

            // ATENÇÃO: a animação de sucesso dispara por timeout no cliente,
            // sem aguardar confirmação real do servidor ('voto_confirmado').
            // Se houver queda de rede entre o clique e o servidor processar,
            // o aluno verá a tela de "Resposta Enviada!" mas o voto não foi contado.
            // O evento 'voto_confirmado' existe no servidor mas não é usado aqui.
            setTimeout(() => {
                botaoAlvo.classList.remove('enviando');
                botaoAlvo.classList.add('sucesso');
                setTimeout(() => bloquearTela(), 1200);
            }, 1500);
        }

        function bloquearTela() {
            jaVotou = true;
            const containers = [document.getElementById('area-botoes'), document.getElementById('area-discursiva'), document.getElementById('btn-confirmar')];
            containers.forEach(el => el.classList.add('fade'));
            
            setTimeout(() => {
                 containers.forEach(el => { el.style.display = 'none'; el.classList.remove('fade'); });
                 document.getElementById('titulo-modo').style.display = 'none';
                 document.getElementById('msg-bloqueio').style.display = 'block';
            }, 300);
        }

        function desbloquearTela() {
            document.getElementById('titulo-modo').style.display = 'block';
            document.getElementById('msg-bloqueio').style.display = 'none';
            // A função renderizarInterface() cuida de mostrar o correto
        }
    </script>
</body>
</html>
