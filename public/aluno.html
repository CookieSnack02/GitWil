<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno | GitWil</title>



    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
    
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/img/favicon/site.webmanifest">

    <style>
        #area-botoes, #area-discursiva { 
            max-width: 500px; margin: 0 auto; width: 100%; 
            display: flex; flex-direction: column; align-items: center; 
        }
        #tela-votacao { display: none; }
        #btn-confirmar { max-width: 500px; margin: 20px auto 0; }
        
        /* Estilo da TextArea Discursiva */
        .input-discursiva {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--accent-color);
            background-color: var(--surface-color);
            color: var(--text-primary);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        .input-discursiva:focus {
            box-shadow: 0 0 15px rgba(13, 131, 253, 0.3);
        }
    </style>
</head>
<body>

    <div id="tela-conectando" class="full-h text-center">
        <div class="spinner-border text-primary mx-auto mb-3" style="width: 3rem; height: 3rem;"></div>
        <h4 class="text-muted fw-bold">Conectando à sala...</h4>
    </div>

    <div id="tela-votacao" class="full-h">
        
        <div class="text-center mb-5">
            <span class="badge rounded-pill bg-secondary bg-opacity-25 fs-6 px-4 py-2" style="color: var(--text-primary);">
                <i class="bi bi-check-circle-fill text-success me-2 small"></i>
                <span id="contador-global" class="fw-bold">0</span> 
                <span id="texto-contador">respostas</span>
            </span>
        </div>

        <h3 id="titulo-modo" class="text-center mb-5 fw-bolder display-6">Aguardando...</h3>
        
        <div id="area-botoes"></div>

        <div id="area-discursiva" style="display:none;">
            <textarea id="texto-resposta" class="input-discursiva" placeholder="Digite sua resposta aqui..."></textarea>
        </div>

        <button id="btn-confirmar" style="display:none;" onclick="enviarRespostaManual()">
            <div class="btn-content-wrapper">
                <span class="btn-texto">ENVIAR RESPOSTA</span>
                <i class="bi bi-arrow-repeat btn-icon-anim icon-spinner"></i>
                <i class="bi bi-check-circle-fill btn-icon-anim icon-check"></i>
            </div>
        </button>

        <div id="msg-bloqueio" class="text-center mt-5 fade show" style="display: none;">
            <i class="bi bi-check-circle-fill text-success display-1 mb-3 d-block"></i>
            <h2 class="fw-bold">Resposta Enviada!</h2>
            <p class="text-muted fs-5">Aguarde a próxima questão.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        
        const savedTheme = localStorage.getItem('gitwil-theme');
        if (savedTheme === 'light') document.body.classList.add('light-mode');
        setTimeout(() => { document.body.classList.add('theme-ready'); }, 100);


        function gerarFingerprint() {
            const dados = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || '',
                navigator.platform || ''
            ].join('|');
            
            let hash = 0;
            for (let i = 0; i < dados.length; i++) {
                const char = dados.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'fp_' + Math.abs(hash).toString(36);
        }

        const alunoId = gerarFingerprint();

        const socket = io('https://gitwil.onrender.com', { auth: { alunoId: alunoId } });
        let codigoSala = '';
        let configAtual = {};
        let selecoes = [];
        let jaVotou = false;
        let timeoutBloqueio = null;

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const codigoUrl = params.get('codigo');
            if (!codigoUrl) { alert("Acesso inválido."); window.location.href = "/"; return; }
            codigoSala = codigoUrl;
            socket.emit('entrar_sala', { codigo: codigoUrl });
        };

        socket.on('entrada_ok', () => {
            document.getElementById('tela-conectando').style.display = 'none';
            document.getElementById('tela-votacao').style.display = 'flex';
        });
        socket.on('erro_sala', (msg) => { alert(msg); window.location.href = "/"; });
        socket.on('erro_voto', (msg) => alert(msg));
        
        socket.on('atualizar_stats_aluno', (d) => {
            const total = d.total;
            document.getElementById('contador-global').innerText = total;
            const label = (total === 1 || total === 0) ? 'resposta' : 'respostas';
            document.getElementById('texto-contador').innerText = label;
        });
        
        socket.on('atualizar_config_aluno', (c) => { configAtual = c; resetarEstado(); });
        socket.on('reset_aluno', resetarEstado);
        socket.on('bloquear_voto', bloquearTela);

        socket.on('sala_encerrada', () => {
            alert('A sala foi encerrada pelo professor.');
            window.location.href = '/';
        });

        function resetarEstado() {
            clearTimeout(timeoutBloqueio);
            jaVotou = false; 
            selecoes = []; 
            document.getElementById('texto-resposta').value = ''; // Limpa texto
            desbloquearTela(); 
            renderizarInterface();
        }

        function renderizarInterface() {
            const areaBtns = document.getElementById('area-botoes');
            const areaDisc = document.getElementById('area-discursiva');
            const btnConf = document.getElementById('btn-confirmar');
            
            areaBtns.innerHTML = '';
            areaBtns.style.display = 'none';
            areaDisc.style.display = 'none';
            btnConf.style.display = 'none';
            btnConf.className = ''; // Reseta classes de animação

            if(jaVotou) return;

            // --- MODO DISCURSIVA ---
            if (configAtual.tipoPergunta === 'discursiva') {
                document.getElementById('titulo-modo').innerText = 'Digite sua resposta:';
                areaDisc.style.display = 'flex';
                btnConf.style.display = 'block';
            } 
            // --- MODO BOTÕES ---
            else {
                areaBtns.style.display = 'flex';
                let opcoes = (configAtual.tipoPergunta === 'certo_errado') ? ['Certo', 'Errado'] : ['A', 'B', 'C', 'D', 'E', 'Não sei'].slice(0, parseInt(configAtual.qtdOpcoes));
                
                document.getElementById('titulo-modo').innerText = configAtual.modoSelecao === 'multipla' ? 'Marque as opções corretas:' : 'Selecione sua resposta:';

                opcoes.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-opcao';
                    btn.innerHTML = `
                        <div class="btn-content-wrapper">
                            <span class="btn-texto">${opt}</span>
                            <i class="bi bi-arrow-repeat btn-icon-anim icon-spinner"></i>
                            <i class="bi bi-check-circle-fill btn-icon-anim icon-check"></i>
                        </div>
                    `;
                    btn.onclick = () => clicarOpcao(btn, opt);
                    areaBtns.appendChild(btn);
                });

                if (configAtual.modoSelecao === 'multipla') btnConf.style.display = 'block';
            }
        }

        function clicarOpcao(btnElement, valor) {
            if(jaVotou) return;
            if (configAtual.modoSelecao === 'unica' || configAtual.tipoPergunta === 'certo_errado') {
                selecoes = valor;
                animarEnvio(btnElement); // Envia direto
            } else {
                if (selecoes.includes(valor)) {
                    selecoes = selecoes.filter(i => i !== valor);
                    btnElement.classList.remove('selecionado');
                } else {
                    selecoes.push(valor);
                    btnElement.classList.add('selecionado');
                }
            }
        }

        // Função chamada pelo botão "Confirmar"
        function enviarRespostaManual() {
            if (configAtual.tipoPergunta === 'discursiva') {
                const texto = document.getElementById('texto-resposta').value.trim();
                if(!texto) return alert("Digite algo antes de enviar.");
                selecoes = texto; // Salva o texto na variável de envio
            }
            animarEnvio(document.getElementById('btn-confirmar'));
        }

        function animarEnvio(botaoAlvo) {
            // Validações
            if (configAtual.tipoPergunta !== 'discursiva' && configAtual.modoSelecao === 'multipla' && selecoes.length === 0) {
                return alert("Selecione pelo menos uma opção!");
            }
            
            jaVotou = true;
            botaoAlvo.classList.remove('selecionado');
            botaoAlvo.classList.add('enviando');

            // Envia (selecoes pode ser array ou string agora)
            socket.emit('enviar_resposta', { codigo: codigoSala, respostas: selecoes });

            setTimeout(() => {
                botaoAlvo.classList.remove('enviando');
                botaoAlvo.classList.add('sucesso');
                timeoutBloqueio = setTimeout(() => bloquearTela(), 1200);
            }, 1500);
        }

        function bloquearTela() {
            jaVotou = true;
            const containers = [document.getElementById('area-botoes'), document.getElementById('area-discursiva'), document.getElementById('btn-confirmar')];
            containers.forEach(el => el.classList.add('fade'));
            
            setTimeout(() => {
                 containers.forEach(el => { el.style.display = 'none'; el.classList.remove('fade'); });
                 document.getElementById('titulo-modo').style.display = 'none';
                 document.getElementById('msg-bloqueio').style.display = 'block';
            }, 300);
        }

        function desbloquearTela() {
            document.getElementById('titulo-modo').style.display = 'block';
            document.getElementById('msg-bloqueio').style.display = 'none';
            // A função renderizarInterface() cuida de mostrar o correto
        }
    </script>
</body>
</html>
